name: VM Smoke Tests

on:
  push:
  workflow_dispatch:
    inputs:
      test:
        description: "Single test package to run (e.g. vm-cad3d-load). Leave empty to run the full suite."
        required: false
        type: string

jobs:
  vm-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # GitHub's ubuntu-latest runners have /dev/kvm but it needs 0666
      # permissions so the Nix build sandbox can access it.
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      # Pick up the latest framework commit from the tracked branch.
      - name: Update ft-framework input
        run: nix flake update ft-framework

      # Run every test individually so a single failure does not cancel the
      # rest.  Failures are accumulated and surfaced in the job summary;
      # the step exits non-zero at the end if any test failed, which causes
      # the workflow to fail and triggers GitHub's normal failure notifications.
      - name: Run VM smoke tests
        run: |
          set +e
          failures=""
          pass=0
          tests=(
            vm-core-boot
            vm-niri-session
            vm-tailscale-load
            vm-containers-rootless-podman
            vm-printing-load
            vm-keepass-load
            vm-nix-index-load
            vm-virt-load
            vm-nfs-framework-load
            vm-cli-load
            vm-mullet-load
            vm-facter-load
            vm-vendor-hw-asus
            vm-vendor-hw-lenovo
            vm-vendor-hw-msi
            vm-vendor-hw-razer
            vm-vendor-hw-logitech
            vm-vendor-hw-corsair
            vm-vendor-hw-openrgb
            vm-vendor-hw-handheld
            vm-rclone-load
            vm-wine-load
            vm-cad3d-load
            vm-git-workflow-load
            vm-gitops-load
            vm-gitops-home-load
            vm-flatpak-load
            vm-webapps-load
            vm-steam-config-load
            vm-moonlight-load
          )

          if [ -n "${{ github.event.inputs.test }}" ]; then
            tests=("${{ github.event.inputs.test }}")
          fi

          for test in "${tests[@]}"; do
            echo "::group::$test"
            if nix build -L --no-link \
              --option system-features "nixos-test kvm benchmark big-parallel" \
              ".#$test"; then
              echo "::notice title=$test::passed"
              pass=$((pass + 1))
            else
              echo "::error title=$test::FAILED"
              failures="$failures $test"
            fi
            echo "::endgroup::"
          done

          total=${#tests[@]}

          {
            echo "## VM Smoke Tests — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "**$pass / $total passed**"
            if [ -n "$failures" ]; then
              echo ""
              echo "### Failed"
              for t in $failures; do
                echo "- ❌ \`$t\`"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failures" ]; then
            echo "FAILED:$failures" >&2
          fi

          [ -z "$failures" ]
