name: Rust Tests

# Manual-dispatch only, like the VM/shell/python tests: the mullet-rs cargo +
# bats suite runs against the framework's experimental scripts/mullet-rs via
# the ft-framework input.
on:
  workflow_dispatch:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Pick up the latest framework commit from the tracked branch.
      - name: Update ft-framework input
        run: nix flake update ft-framework

      # Run via `nix run` (not `nix build`): `cargo test` needs real network
      # access to fetch crate dependencies, which the sandboxed builder lacks.
      - name: Run mullet-rs test suite (cargo test + bats)
        run: nix run .#rust-tests
