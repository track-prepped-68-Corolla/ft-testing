name: VM Bootstrap Workflow Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - testing
      - main

jobs:
  vm-bootstrap-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # GitHub's ubuntu-latest runners have /dev/kvm but it needs 0666
      # permissions so the Nix build sandbox can access it.
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      # Pick up the latest framework commit from the tracked branch.
      - name: Update ft-framework input
        run: nix flake update ft-framework

      - name: Run bootstrap workflow VM test
        run: |
          nix build -L --no-link \
            --option system-features "nixos-test kvm benchmark big-parallel" \
            .#vm-bootstrap-workflow
