name: Shell Tests

# Manual-dispatch only, like the VM tests: the ft shell-recipe suite
# (shellcheck + bats unit and integration) runs against the framework's
# scripts/ via the ft-framework input.
on:
  workflow_dispatch:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Pick up the latest framework commit from the tracked branch.
      - name: Update ft-framework input
        run: nix flake update ft-framework

      # Run via `nix run` (not `nix build`): the framework recipes, mocks, and
      # helpers execute through their #!/usr/bin/env bash shebangs, which the
      # Nix build sandbox can't satisfy (no /usr/bin/env). The runner can.
      - name: Run shell test suite (shellcheck + bats)
        run: nix run .#shell-tests
