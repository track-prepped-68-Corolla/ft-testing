name: Python Tests

# Manual-dispatch only, like the VM and shell tests: the ft_py pytest suite
# runs against the framework's already-built venv via the ft-framework input.
on:
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@v14

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Pick up the latest framework commit from the tracked branch.
      - name: Update ft-framework input
        run: nix flake update ft-framework

      - name: Run ft_py pytest suite
        run: nix run .#python-tests
